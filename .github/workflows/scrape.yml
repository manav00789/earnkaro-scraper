name: Daily Retailer Scrape

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC = 7:30 AM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # canvas package needs these system libs
      - name: Install system dependencies for canvas
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Browser
        run: npx playwright install chromium --with-deps

      - name: Run Scraper
        run: node scraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EARNKARO_EMAIL: ${{ secrets.EARNKARO_EMAIL }}
          EARNKARO_PASSWORD: ${{ secrets.EARNKARO_PASSWORD }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          retention-days: 7
